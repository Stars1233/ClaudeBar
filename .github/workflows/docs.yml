name: Docs

# Checks docs against docs/documentation-design/README.md#enforcement.
# Report-only until the migration's last step switches it to --strict.

on:
  pull_request:
    paths:
      - '**.md'
      - 'scripts/check-docs.py'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'scripts/check-docs.py'

permissions:
  contents: read

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check docs (report-only)
        run: python3 scripts/check-docs.py
